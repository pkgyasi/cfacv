# Settings for one string run with the thalweg driver.  Copy and edit.
set num_replicas 16                       ;# read by the launcher, not the driver
set TEMP 300
set steps_per_run 5                       ;# MD steps between string updates
set num_runs 30000                        ;# cap on updates; the drift test usually ends the run first
set runs_per_frame 100                    ;# updates per history line and trajectory frame
set frames_per_restart 50
set outputEnergiesEvery 10000
set namd_config_file "base_string.namd"   ;# system, dynamics, tclforces; see README
set init_restr_file "string0/restr.job0.%s.inp"
set initial_root "string0/go"
set output_root "output/%s/tw"
set TW(zscale) {1.0 1.0}                  ;# one length scale per CV, from endpoint_analysis.py
set TW(memory) 200
set TW(calibrate) 200
set TW(max_move) 0.002
set TW(conv_window) 10
set TW(conv_tol) 0.1
set TW(conv_count) 3
