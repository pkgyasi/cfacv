# Continuation: resumes from the newest restart state the driver wrote.
if {[info exists env(CFACV_BASEDIR)]} { set CFACV_BASEDIR $env(CFACV_BASEDIR) } else { puts "set CFACV_BASEDIR"; exit 1 }
if {[info exists env(THALWEG)]} { set THALWEG $env(THALWEG) } else { set THALWEG $CFACV_BASEDIR/thalweg }
source string.conf
if {[info exists env(TW_RESTART_FILE)]} {
  set restart_file $env(TW_RESTART_FILE)
} else {
  set best ""; set bestn -1
  foreach f [glob -nocomplain [format "$output_root.job*.restart*.state.tcl" 0]] {
    if {[regexp {restart([0-9]+)\.state\.tcl$} $f -> n] && $n > $bestn} { set bestn $n; set best $f }
  }
  if {$best eq ""} { puts "TW) ERROR: no restart state found; has the first leg reached a restart point?"; exit 1 }
  set restart_file $best
}
if { ! [catch numPes] } { source $THALWEG/driver/string_driver.tcl }
